[project]
name = "fastapi-gateway"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "prometheus-client>=0.26.0",
    "PyExecJS2>=1.6.1",
    "uvicorn>=0.52.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.16.5",
]

[tool.ruff.lint]
ignore = ["E501"]  # 长 header/token 行暂不治理，等配置化重构时一并解决
